<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Credential and configuration boundary</title>
<desc id="desc">Empty current environment template separated from two historical Telegram-token alerts and provider-side revocation.</desc>
<style>
  .bg { fill: #07111f; }
  .panel { fill: #0f2035; stroke: #315270; stroke-width: 2; }
  .panel2 { fill: #122941; stroke: #41698c; stroke-width: 2; }
  .title { fill: #f4f8ff; font: 700 34px ui-monospace, SFMono-Regular, Consolas, monospace; }
  .sub { fill: #9ec8e8; font: 18px ui-monospace, SFMono-Regular, Consolas, monospace; }
  .head { fill: #f4f8ff; font: 700 21px ui-monospace, SFMono-Regular, Consolas, monospace; }
  .body { fill: #d4e5f4; font: 17px ui-monospace, SFMono-Regular, Consolas, monospace; }
  .small { fill: #9ec8e8; font: 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
  .good { fill: #65d6a6; font: 700 17px ui-monospace, SFMono-Regular, Consolas, monospace; }
  .warn { fill: #ffcc66; font: 700 17px ui-monospace, SFMono-Regular, Consolas, monospace; }
  .bad { fill: #ff7b86; font: 700 17px ui-monospace, SFMono-Regular, Consolas, monospace; }
  .line { stroke: #77b6dd; stroke-width: 3; fill: none; }
</style>
<rect class="bg" width="1280" height="720"/>
<text x="60" y="62" class="title" text-anchor="start">SSSSD / CREDENTIAL BOUNDARY</text>
<text x="60" y="94" class="sub" text-anchor="start">Key names counted; values are neither retained in evidence nor displayed.</text>
<rect x="60" y="150" width="360" height="165" rx="18" class="panel"/>
<text x="84" y="194" class="head" text-anchor="start">LOCAL PATHS</text>
<text x="84" y="238" class="body" text-anchor="start">2 declared keys</text>
<text x="84" y="277" class="small" text-anchor="start">database + native library</text>
<rect x="460" y="150" width="360" height="165" rx="18" class="panel"/>
<text x="484" y="194" class="head" text-anchor="start">BOT CHANNEL</text>
<text x="484" y="238" class="body" text-anchor="start">2 declared keys</text>
<text x="484" y="277" class="small" text-anchor="start">bot token + chat identifier</text>
<rect x="860" y="150" width="360" height="165" rx="18" class="panel"/>
<text x="884" y="194" class="head" text-anchor="start">STREAM SESSION</text>
<text x="884" y="238" class="body" text-anchor="start">4 declared keys</text>
<text x="884" y="277" class="small" text-anchor="start">API/session/chat settings</text>
<rect x="60" y="365" width="540" height="210" rx="18" class="panel2"/>
<text x="90" y="410" class="head" text-anchor="start">CURRENT DEFAULT BRANCH</text>
<text x="90" y="454" class="good" text-anchor="start">8 env keys · 0 non-empty values</text>
<text x="90" y="492" class="good" text-anchor="start">.env is not tracked</text>
<text x="90" y="530" class="good" text-anchor="start">evidence values emitted: 0</text>
<rect x="680" y="365" width="540" height="210" rx="18" class="panel2"/>
<text x="710" y="410" class="head" text-anchor="start">HISTORICAL / PROVIDER STATE</text>
<text x="710" y="454" class="bad" text-anchor="start">2 Telegram token alerts remain open</text>
<text x="710" y="492" class="warn" text-anchor="start">revocation cannot be proven from Git</text>
<text x="710" y="530" class="warn" text-anchor="start">owner action: issue #2</text>
<text x="640" y="650" class="bad" text-anchor="middle">CURRENT-TREE CLEANUP DOES NOT REVOKE A HISTORICAL TOKEN</text>
</svg>
