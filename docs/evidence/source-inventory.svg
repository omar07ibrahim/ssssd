<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Quarantined desktop source inventory</title>
<desc id="desc">Exact static counts and hashes for the retained Python and empty environment-template surfaces.</desc>
<style>
  .bg { fill: #07111f; }
