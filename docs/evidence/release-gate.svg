<text x="88" y="613" class="head" text-anchor="start">public-release</text>
<text x="1190" y="613" class="bad" text-anchor="end">BLOCKED</text>
<text x="88" y="638" class="small" text-anchor="start">No release or promotional capture before credentials, rights, licensing, and synthetic-fixture gates close</text>
<text x="640" y="685" class="bad" text-anchor="middle">PUBLIC RELEASE: BLOCKED · owner actions tracked in issue #2</text>
